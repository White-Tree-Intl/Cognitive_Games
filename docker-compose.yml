services:
  cognitive-games:
    build: .
    container_name: cognitive-games
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      PORT: ${PORT:-5000}
    volumes:
      - cognitive_games_data:/app/instance

volumes:
  cognitive_games_data:
